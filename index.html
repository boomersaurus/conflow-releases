<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConFlow</title>
<meta name="robots" content="noindex">

<!--
  ============================================================================
  Wurzelseite von conflow.app. Wer nur die Domain eintippt, landet hier.

  Sie leitet auf die Kaufseite weiter. Der Verweis ist RELATIV -- damit
  funktioniert die Seite unter conflow.app genauso wie unter der
  github.io-Adresse, ohne dass irgendwo ein Rechnername festgeschrieben ist.

  Das Ziel steht an ZWEI Stellen: im <meta>-Element und im sichtbaren
  Verweis. Beide aendern, sonst leitet die Seite woandershin, als der
  Verweis verspricht. Pruefung (d) im Bauskript sieht nach.

  Spaeter soll hier die Startseite mit den zwoelf Kacheln stehen. Bis dahin
  ist eine Weiterleitung besser als die 404-Seite von GitHub.
  ============================================================================
-->

<meta http-equiv="refresh" content="0; url=kaufen/">

<style>
  /* Ohne fremde Schriften und ohne eigenes Stylesheet: Diese Seite muss auch
     dann etwas Lesbares zeigen, wenn sonst nichts geladen wird. */
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) { body { background: #131314; color: #f5f5f7; } }
  .marke { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 10px; }
  p { margin: 0 0 22px; color: #6e6e73; }
  @media (prefers-color-scheme: dark) { p { color: #9a9a9e; } }
  a {
    display: inline-block;
    background: #0071e3;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    padding: 12px 26px;
    border-radius: 980px;
  }
</style>
</head>
<body>
  <div>
    <p class="marke">ConFlow</p>
    <p>Einen Augenblick, es geht weiter.</p>
    <!-- Zweite Stelle mit dem Ziel. Der sichtbare Verweis ist die
         Rueckfallebene, falls die automatische Weiterleitung nicht greift. -->
    <a href="kaufen/">Weiter zu ConFlow</a>
  </div>
</body>
</html>
