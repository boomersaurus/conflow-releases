<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConFlow Pro</title>
<meta name="robots" content="noindex">

<!--
  ============================================================================
  Diese Seite ist eine WEITERLEITUNG, nicht die Kaufseite.

  Sie hat genau eine Aufgabe: eine Adresse zu sein, die sich nie aendert.
  ConFlow verweist ausschliesslich hierher. Wohin es von hier aus weitergeht,
  laesst sich jederzeit umstellen -- und deshalb bleiben auch aeltere,
  laengst ausgelieferte Programmfassungen erreichbar, wenn der Verkaufsweg
  einmal wechselt.

  ZIEL UMSTELLEN
  Die Zieladresse steht an ZWEI Stellen: im <meta>-Element unten und im
  sichtbaren Verweis im Seitenkoerper. Beide aendern -- sonst leitet die
  Seite woandershin, als der Verweis verspricht.

  Diese Datei niemals umbenennen oder verschieben.
  ============================================================================
-->

<meta http-equiv="refresh" content="0; url=https://boomersaurus.github.io/conflow-releases/kaufen/">

<style>
  /* Ohne fremde Schriften und ohne eigenes Stylesheet: Diese Seite muss auch
     dann etwas Lesbares zeigen, wenn sonst nichts geladen wird. */
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) { body { background: #131314; color: #f5f5f7; } }
  .marke { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 10px; }
  p { margin: 0 0 22px; color: #6e6e73; }
  @media (prefers-color-scheme: dark) { p { color: #9a9a9e; } }
  a {
    display: inline-block;
    background: #0071e3;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    padding: 12px 26px;
    border-radius: 980px;
  }
</style>
</head>
<body>
  <div>
    <p class="marke">ConFlow</p>
    <p>Sie werden zur Kaufseite weitergeleitet.</p>
    <!-- Zweite Stelle mit der Zieladresse. Der sichtbare Verweis ist die
         Rueckfallebene, falls die automatische Weiterleitung nicht greift. -->
    <a href="https://boomersaurus.github.io/conflow-releases/kaufen/">Weiter zur Kaufseite</a>
  </div>
</body>
</html>
